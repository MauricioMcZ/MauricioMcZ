name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # roda todo dia à meia-noite (UTC)
  workflow_dispatch: {}    # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main               # troque para "master" se for o nome da sua branch padrão

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar arquivo SVG da snake
        uses: Platane/snk@v3
        with:
          github_user_name: MauricioMcZ
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar o SVG gerado na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
